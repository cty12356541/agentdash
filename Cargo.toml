[package]
name = "agentdash"
version = "0.7.0"
edition = "2024"

[dependencies]
crossterm = "0.29"
ratatui = "0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# W4-005:性质测试专用(dev-only,不进发布二进制,不违背零运行时依赖哲学)
[dev-dependencies]
proptest = "1"

[lints.clippy]
all = "warn"
pedantic = "warn"
